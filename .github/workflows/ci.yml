name: ci

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '9.6.1'
  NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.22.1'
  BUILD_TOOLS_VERSION: '36.0.0'
  COMPILE_SDK: '37.0'
  API_LEVEL: '35'
  ANDROID_TARGET: 'google_apis'
  ANDROID_ARCH: 'x86_64'
  AVD_NAME: 'ayana_ci'
  EMU_BOOT_TIMEOUT_SEC: '400'
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    name: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Licenses are accepted by setup-android below; no duplicate step.
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      # Runner images ship these components; the install is a fast no-op.
      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      # Debug keystore: AGP needs one to sign debug APKs; a fresh runner
      # might not have ~/.android/debug.keystore yet.
      - name: Ensure debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # setup-gradle caches Gradle itself and dependency caches automatically.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # The release key, when the repository has one in its secrets; without it the build falls
      # back to the debug key kept in the repository, the same on every run.
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release key: from secrets"
          else
            echo "Release key: none in secrets, signing with the repository debug key"
          fi

      - name: Unit tests and APKs (debug + release)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --warning-mode summary

      - name: Collect outputs
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p build_out/release build_out/debug
          cp app/build/outputs/apk/debug/*universal*.apk "build_out/debug/ayana-$VERSION-debug.apk"
          for ABI in universal arm64-v8a armeabi-v7a x86_64; do
            cp app/build/outputs/apk/release/*-"$ABI"-release.apk "build_out/release/ayana-$VERSION-$ABI.apk"
          done
          ( cd build_out/release && sha256sum *.apk > SHA256SUMS )
          ls -lh build_out/release build_out/debug

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: ayana-release
          path: build_out/release
          if-no-files-found: error
          compression-level: 0

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ayana-debug
          path: build_out/debug
          if-no-files-found: error
          compression-level: 0

      - name: Upload unit test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore


  smoke:
    name: emulator-smoke
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install platform tools and build tools
        run: |
          sdkmanager --install "platform-tools" "build-tools;${BUILD_TOOLS_VERSION}" "platforms;android-${API_LEVEL}"
          echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}" >> $GITHUB_PATH

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: ayana-debug
          path: downloaded_apk

      - name: Locate APK
        run: |
          mkdir -p emulator_work
          cp "$(find downloaded_apk -name '*.apk' -print -quit)" emulator_work/app.apk
          echo "APK_PATH=${GITHUB_WORKSPACE}/emulator_work/app.apk" >> $GITHUB_ENV

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM enabled"
          else
            echo "KVM not available"
          fi

      - name: Make smoke script executable
        run: chmod +x ci/emulator_run.sh

      - name: Boot emulator, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: true
          disable-linux-hw-accel: false
          emulator-options: >
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
            -no-snapshot-save
            -no-metrics
            -memory 4096
            -accel on
          emulator-boot-timeout: ${{ env.EMU_BOOT_TIMEOUT_SEC }}
          script: ./ci/emulator_run.sh

      - name: Upload emulator data
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-data
          path: emulator_logs
          if-no-files-found: warn

  # A green run on the main branch publishes a release for the version in the build, once: when
  # the version is bumped, the next green run releases it; later runs of the same version skip.
  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release APKs
        uses: actions/download-artifact@v8
        with:
          name: ayana-release
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" release/*.apk release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Ayana $VERSION" \
            --generate-notes
